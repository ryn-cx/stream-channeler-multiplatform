# TODO: Validate
# Pushing a tag such as v0.1.0 builds the userscript and attaches it to a GitHub release. The userscript's updateURL
# and downloadURL point at the newest release's copy, so installed userscripts update from it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check that the tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/stream-channeler.user.js --title "${GITHUB_REF_NAME}" --generate-notes
