# TODO: Validate
# Publishing a GitHub release builds the userscript and attaches it to that release. The userscript's updateURL and
# downloadURL point at the newest release's copy, so installed userscripts update from it.
name: deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      # Userscript managers only install an update when @version goes up, so a release whose tag does not match
      # package.json's version would never reach installed copies.
      - name: Check that the release tag matches package.json
        run: test "${{ github.event.release.tag_name }}" = "v$(node -p "require('./package.json').version")"

      - run: npm run build

      - name: Upload the userscript to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/stream-channeler.user.js --clobber
